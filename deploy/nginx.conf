# 1. Replace /var/www/academy-web with the real project path on the VPS
# 2. Copy to /etc/nginx/sites-available/academy
# 3. ln -sf /etc/nginx/sites-available/academy /etc/nginx/sites-enabled/academy
# 4. nginx -t && systemctl reload nginx
# Keep the existing certbot certificate paths if they differ.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name professor-irannejad-5i-academy.ir www.professor-irannejad-5i-academy.ir;
    return 301 https://professor-irannejad-5i-academy.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.professor-irannejad-5i-academy.ir;
    ssl_certificate     /etc/letsencrypt/live/professor-irannejad-5i-academy.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/professor-irannejad-5i-academy.ir/privkey.pem;
    return 301 https://professor-irannejad-5i-academy.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name professor-irannejad-5i-academy.ir;

    ssl_certificate     /etc/letsencrypt/live/professor-irannejad-5i-academy.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/professor-irannejad-5i-academy.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    # Serve hashed Next assets from disk so Node is not blocked.
    location /_next/static/ {
        alias /var/www/academy-web/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /brand/ {
        alias /var/www/academy-web/public/brand/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /fonts/ {
        alias /var/www/academy-web/public/fonts/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }
}
